# Builds the distributable bundles for every desktop platform and attaches
# them to a draft GitHub release. No signing certificate is involved on any
# platform: the macOS bundle is ad-hoc signed (`signing-identity = "-"` in
# Cargo.toml's packager section), Windows and Linux bundles are unsigned. The
# per-platform first-launch steps this implies are documented in README.md.
#
# Trigger: push a tag `vX.Y.Z` whose version matches the one declared in
# Cargo.toml and flake.nix. A manual run (workflow_dispatch) builds the same
# bundles and keeps them as workflow artifacts without touching releases.
name: release

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:

permissions:
    contents: write

jobs:
    # The tag is the release's version; refuse to build if the places the
    # version is declared disagree with it, so a release can never carry a
    # different version than its bundles. Then open the draft the builds
    # attach to.
    prepare:
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Compare the tag with every declared version
              run: |
                  tag="${GITHUB_REF_NAME#v}"
                  cargo="$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')"
                  nix="$(grep -m1 'version = "' flake.nix | sed 's/.*version = "\(.*\)";/\1/')"
                  echo "tag=$tag Cargo.toml=$cargo flake.nix=$nix"
                  for declared in "$cargo" "$nix"; do
                    if [ "$declared" != "$tag" ]; then
                      echo "::error::version mismatch: tag v$tag vs declared $declared"
                      exit 1
                    fi
                  done
            - name: Open the draft release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  version="${GITHUB_REF_NAME#v}"
                  cat > notes.md <<EOF
                  Unsigned builds — see the [install notes](https://github.com/obazin/janis#install) for the first-launch step each platform asks for.

                  - **macOS**: \`curl -fsSL https://raw.githubusercontent.com/obazin/janis/main/scripts/macos/install.sh | sh\` (no Gatekeeper prompt), or \`Janis_${version}_aarch64.dmg\` (Apple Silicon) / \`Janis_${version}_x64.dmg\` (Intel) by hand
                  - **Windows**: \`Janis_${version}_x64-setup.exe\` (or the \`.msi\`)
                  - **Linux**: \`.AppImage\`, \`.deb\` or \`.rpm\`, x86_64 and arm64
                  - **Nix** (Linux and macOS): \`nix profile install github:obazin/janis\`, or \`nix run github:obazin/janis\` to try it
                  EOF
                  gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
                    gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                      --draft --title "Janis $version" --notes-file notes.md --generate-notes

    build:
        needs: prepare
        # workflow_dispatch skips prepare; run the builds anyway.
        if: always() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped')
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: macos-latest # Apple Silicon
                    - platform: macos-15-intel # Intel Macs
                    - platform: ubuntu-22.04 # oldest glibc the bundles will need
                    - platform: ubuntu-22.04-arm
                    - platform: windows-latest
        runs-on: ${{ matrix.platform }}
        steps:
            - uses: actions/checkout@v7

            # fontconfig, xkbcommon, wayland, X11 and GL for the window; alsa for
            # the audio output; the rest for the AppImage and deb bundlers. cmake
            # (libopus) ships with the image.
            - name: Install Linux build dependencies
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libasound2-dev libfontconfig1-dev libxkbcommon-dev \
                    libxkbcommon-x11-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev \
                    libxrandr-dev libxcb1-dev libgl1-mesa-dev libegl1-mesa-dev patchelf xdg-utils

            - uses: dtolnay/rust-toolchain@stable

            - uses: swatinem/rust-cache@v2

            - name: Install the packagers
              shell: bash
              run: |
                  cargo install cargo-packager --locked
                  if [ "$RUNNER_OS" = "Linux" ]; then
                    cargo install cargo-generate-rpm --locked
                  fi

            # Each runner builds for its own architecture, and the packager
            # makes every format its platform has.
            - name: Build the bundles
              run: |
                  cargo build --release
                  cargo packager --release

            # The packager has no rpm format; this one is built from the same
            # release binary.
            - name: Build the rpm
              if: runner.os == 'Linux'
              run: |
                  cargo generate-rpm
                  cp target/generate-rpm/*.rpm dist/

            - name: Gather the bundles
              shell: bash
              run: |
                  mkdir -p bundles
                  find dist -maxdepth 1 -type f \
                    \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \
                       -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) \
                    -exec cp {} bundles/ \;
                  ls -la bundles

            - name: Attach the bundles to the draft release
              if: github.event_name == 'push'
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release upload "$GITHUB_REF_NAME" bundles/* --repo "$GITHUB_REPOSITORY" --clobber

            - name: Keep the bundles as workflow artifacts
              if: github.event_name == 'workflow_dispatch'
              uses: actions/upload-artifact@v4
              with:
                  name: janis-${{ matrix.platform }}
                  path: bundles/*
