# Builds the distributable bundles for every desktop platform and attaches
# them to a draft GitHub release. No signing certificate is involved on any
# platform: macOS bundles are ad-hoc signed (`bundle.macOS.signingIdentity`
# is "-" in tauri.conf.json), Windows and Linux bundles are unsigned. The
# per-platform first-launch steps this implies are documented in README.md.
#
# Trigger: push a tag `vX.Y.Z` whose version matches the one declared in
# tauri.conf.json, Cargo.toml, package.json and flake.nix. A manual run
# (workflow_dispatch) builds the same bundles and keeps them as workflow
# artifacts without touching releases.
name: release

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:

permissions:
    contents: write

jobs:
    # The tag is the release's version; refuse to build if the four places the
    # version is declared disagree with it, so a release can never carry a
    # different version than its bundles.
    verify-version:
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Compare the tag with every declared version
              run: |
                  tag="${GITHUB_REF_NAME#v}"
                  conf="$(jq -r .version src-tauri/tauri.conf.json)"
                  cargo="$(grep -m1 '^version = ' src-tauri/Cargo.toml | sed 's/version = "\(.*\)"/\1/')"
                  node="$(jq -r .version package.json)"
                  nix="$(grep -m1 'version = "' flake.nix | sed 's/.*version = "\(.*\)";/\1/')"
                  echo "tag=$tag tauri.conf.json=$conf Cargo.toml=$cargo package.json=$node flake.nix=$nix"
                  for declared in "$conf" "$cargo" "$node" "$nix"; do
                    if [ "$declared" != "$tag" ]; then
                      echo "::error::version mismatch: tag v$tag vs declared $declared"
                      exit 1
                    fi
                  done

    build:
        needs: verify-version
        # workflow_dispatch skips verify-version; run the builds anyway.
        if: always() && (needs.verify-version.result == 'success' || needs.verify-version.result == 'skipped')
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: macos-latest # Apple Silicon
                      target: aarch64-apple-darwin
                    - platform: macos-15-intel # Intel Macs
                      target: x86_64-apple-darwin
                    - platform: ubuntu-22.04 # oldest glibc/webkit the bundles will need
                      target: x86_64-unknown-linux-gnu
                    - platform: ubuntu-22.04-arm
                      target: aarch64-unknown-linux-gnu
                    - platform: windows-latest
                      target: x86_64-pc-windows-msvc
        runs-on: ${{ matrix.platform }}
        steps:
            - uses: actions/checkout@v7

            # webkit/gtk for the window, alsa for cpal's output backend, the rest
            # for the AppImage/deb/rpm bundlers. cmake (libopus) ships with the image.
            - name: Install Linux build dependencies
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libasound2-dev

            - uses: pnpm/action-setup@v6
              with:
                  version: 10

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: pnpm

            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}

            - uses: swatinem/rust-cache@v2
              with:
                  workspaces: './src-tauri -> target'

            - name: Install frontend dependencies
              run: pnpm install --frozen-lockfile

            - uses: tauri-apps/tauri-action@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  args: --target ${{ matrix.target }}
                  # No updater plugin: nothing consumes latest.json or the .sig files.
                  uploadUpdaterJson: false
                  uploadUpdaterSignatures: false
                  # Tag pushes attach the bundles to a draft release; manual runs keep
                  # them as workflow artifacts only.
                  tagName: ${{ github.event_name == 'push' && github.ref_name || '' }}
                  releaseName: ${{ github.event_name == 'push' && 'Janis __VERSION__' || '' }}
                  releaseDraft: true
                  generateReleaseNotes: ${{ github.event_name == 'push' }}
                  releaseBody: |
                      Unsigned builds — see the [install notes](https://github.com/obazin/janis#install) for the first-launch step each platform asks for.

                      - **macOS**: `Janis_x.y.z_aarch64.dmg` (Apple Silicon) or `Janis_x.y.z_x64.dmg` (Intel)
                      - **Windows**: `Janis_x.y.z_x64-setup.exe` (or the `.msi`)
                      - **Linux**: `.AppImage`, `.deb` or `.rpm`, x86_64 and arm64
                  uploadWorkflowArtifacts: ${{ github.event_name == 'workflow_dispatch' }}
