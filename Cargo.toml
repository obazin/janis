[package]
name = "janis"
version = "0.1.0"
description = "Janis — open-source desktop audio player: local library, web radio, 10-band EQ and live visualisation."
authors = ["Olivier Bazin"]
license = "GPL-3.0-only"
edition = "2021"
publish = false

# The binary is "Janis" (capitalized) so the operating system shows that name
# for a build run outside its application bundle.
[[bin]]
name = "Janis"
path = "src/main.rs"

[build-dependencies]
slint-build = "1.18"
serde_json = "1.0.149"

[dependencies]
# The user interface. winit + FemtoVG only; `unstable-winit-030` gives access
# to the window attributes (overlay title bar) and window events (file drop)
# Slint does not expose itself.
slint = { version = "1.18", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-femtovg",
    "unstable-winit-030",
    "accessibility",
] }
# Decodes cover art (embedded in files, or announced by a station) into pixels
# the interface can draw.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
# The system's file and folder pickers.
rfd = "0.15"
# Cover art reaches Janis base64-encoded, from the audio facade and from
# stations alike.
base64 = "0.22"
# Drives the one asynchronous facade call — connecting to a station — from a
# thread of its own.
tokio = { version = "1", features = ["rt"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
log = "0.4.29"
# Resolves the per-user data directory on every platform.
dirs = "6"
# `bundled` ships SQLite with the binary so we don't depend on the system
# library version. `janis.db` holds the track library and user preferences.
rusqlite = { version = "0.31", features = ["bundled"] }
# Recursive folder walk for the library scanner (the one filesystem concern
# Janis keeps — everything the scanner reads *from* each file comes back
# through the audio-stack facade).
walkdir = "2"

# The whole audio path — engine, web radio, and audio-file metadata parsing —
# lives in this standalone MIT crate (https://github.com/obazin/audio-stack-rs).
# Janis imports only its facade: none of the audio/metadata crates (cpal,
# symphonia, lofty, stream-download, opus, …) are direct dependencies here.
# Pinned to a tag; `Cargo.lock` records the exact commit. The dev-profile
# `opt-level = 2` override below still applies to it (and its transitive
# deps), so realtime DSP stays fast.
#
# `fir-eq` opts into the linear-phase EQ: the same ten bands with no
# inter-band phase distortion, offered by the equalizer sheet as a quality
# mode. Pure code in the crate — it reuses the `realfft` the analyser already
# links — so it pulls in no new dependency.
audio-stack-rs = { git = "https://github.com/obazin/audio-stack-rs", tag = "spectral-dsp", features = [
    "fir-eq",
] }

# Audio DSP is unusably slow under the default dev profile (opt-level 0 in
# every dependency means the decoder cannot keep the ring fed). Optimise
# dependencies while keeping our own crate debuggable.
[profile.dev.package."*"]
opt-level = 2
