[package]
name = "janis"
version = "0.2.0"
description = "Janis — open-source desktop audio player: local library, web radio, 10-band EQ and live visualisation."
authors = ["Olivier Bazin"]
license = "GPL-3.0-only"
edition = "2021"
publish = false

# The binary is "Janis" (capitalized) so the operating system shows that name
# for a build run outside its application bundle.
[[bin]]
name = "Janis"
path = "src/main.rs"

[build-dependencies]
slint-build = "1.18"
serde_json = "1.0.149"

[dependencies]
# The user interface. winit + FemtoVG only; `unstable-winit-030` gives access
# to the window attributes (overlay title bar) and window events (file drop)
# Slint does not expose itself.
slint = { version = "1.18", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-femtovg",
    "unstable-winit-030",
    "accessibility",
] }
# Decodes cover art (embedded in files, or announced by a station) into pixels
# the interface can draw.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
# The system's file and folder pickers.
rfd = "0.15"
# Cover art reaches Janis base64-encoded, from the audio facade and from
# stations alike.
base64 = "0.22"
# Drives the one asynchronous facade call, connecting to a station. The
# runtime outlives the call: the station's download keeps running on it.
tokio = { version = "1", features = ["rt-multi-thread"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
log = "0.4.29"
# The Jellyfin client: a few JSON calls and cover pictures, made on a worker
# thread. The version and rustls stack `audio-stack-rs` already links for web
# radio, so no second TLS implementation is built.
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "json",
    "rustls",
] }
# Resolves the per-user data directory on every platform.
dirs = "6"
# `bundled` ships SQLite with the binary so we don't depend on the system
# library version. `janis.db` holds the track library and user preferences.
rusqlite = { version = "0.31", features = ["bundled"] }
# Recursive folder walk for the library scanner (the one filesystem concern
# Janis keeps — everything the scanner reads *from* each file comes back
# through the audio-stack facade).
walkdir = "2"

# The whole audio path — engine, web radio, and audio-file metadata parsing —
# lives in this standalone MIT crate (https://github.com/obazin/audio-stack-rs).
# Janis imports only its facade: none of the audio/metadata crates (cpal,
# symphonia, lofty, stream-download, opus, …) are direct dependencies here.
# Pinned to a tag; `Cargo.lock` records the exact commit. The dev-profile
# `opt-level = 2` override below still applies to it (and its transitive
# deps), so realtime DSP stays fast.
#
# `fir-eq` opts into the linear-phase EQ: the same ten bands with no
# inter-band phase distortion, offered by the equalizer sheet as a quality
# mode. Pure code in the crate — it reuses the `realfft` the analyser already
# links — so it pulls in no new dependency.
audio-stack-rs = { git = "https://github.com/obazin/audio-stack-rs", tag = "daw-overview", features = [
    "fir-eq",
] }

# Audio DSP is unusably slow under the default dev profile (opt-level 0 in
# every dependency means the decoder cannot keep the ring fed). Optimise
# dependencies while keeping our own crate debuggable.
# The calls `platform` makes to lower a thread's priority.
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
# Unique temporary directories, removed when a test ends, so concurrent test
# runs never share or delete each other's databases and folders.
tempfile = "3"
# Property tests: invariants checked over generated inputs, shrunk to the
# smallest failing case.
proptest = "1"

[profile.dev.package."*"]
opt-level = 2

# ── Distribution ──────────────────────────────────────────────────────────────
# `just release-macos` (or `release-linux`, `release-windows`) builds the
# release binary, then `cargo packager --release` makes the installers of the
# platform it runs on, into `dist/`: a DMG on macOS, NSIS and MSI installers on Windows, an
# AppImage and a deb on Linux. No signing certificate is involved: the macOS
# bundle is ad-hoc signed, the others are unsigned.
[package.metadata.packager]
product-name = "Janis"
identifier = "com.olivierbazin.janis"
publisher = "Olivier Bazin"
homepage = "https://github.com/obazin/janis"
category = "Music"
description = "Open-source desktop audio player"
long-description = "Local library with real metadata, curated web radio, a live 10-band equalizer and live waveform visualisation."
out-dir = "dist"
icons = [
    "packaging/icons/32x32.png",
    "packaging/icons/128x128.png",
    "packaging/icons/128x128@2x.png",
    "packaging/icons/icon.icns",
    "packaging/icons/icon.ico",
]

[package.metadata.packager.macos]
signing-identity = "-"
minimum-system-version = "11.0"

# cpal's Linux backend links ALSA, which the packager does not add by itself.
[package.metadata.packager.deb]
depends = ["libasound2"]

# The rpm is built by `cargo generate-rpm`, from the same release binary.
[package.metadata.generate-rpm]
name = "janis"
summary = "Open-source desktop audio player"
assets = [
    { source = "target/release/Janis", dest = "/usr/bin/Janis", mode = "755" },
    { source = "packaging/linux/janis.desktop", dest = "/usr/share/applications/janis.desktop", mode = "644" },
    { source = "packaging/icons/128x128.png", dest = "/usr/share/icons/hicolor/128x128/apps/janis.png", mode = "644" },
    { source = "packaging/icons/128x128@2x.png", dest = "/usr/share/icons/hicolor/256x256/apps/janis.png", mode = "644" },
]

[package.metadata.generate-rpm.requires]
"libasound.so.2()(64bit)" = "*"
