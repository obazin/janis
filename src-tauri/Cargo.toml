[package]
name = "janis"
version = "0.1.0"
description = "Janis — open-source desktop audio player: local library, web radio, 10-band EQ and live visualisation."
authors = ["Olivier Bazin"]
license = "GPL-3.0-only"
edition = "2021"
publish = false

# Compiled binary is "Janis" (capitalized) so macOS shows "Janis" in the dock
# during `tauri dev` — the dev binary runs without an .app wrapper, so its
# filename is what AppKit displays. Matches `mainBinaryName` in tauri.conf.json.
[[bin]]
name = "Janis"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
# No `protocol-asset`: nothing in the webview loads files. Audio is decoded
# in Rust and cover art crosses IPC as base64, so the webview has no path to
# the filesystem at all.
tauri = { version = "2.10", features = [] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1", features = ["full"] }
tauri-plugin-dialog = "2.7"
tauri-plugin-log = "2.8"
# Second-launch guard: a second Janis process must never run — it would race
# the SQLite write lock on `janis.db`. The plugin hands the second launch to
# the running instance (which focuses its window) and exits it. Registered
# FIRST in the builder so the guard exists before any state/setup work.
tauri-plugin-single-instance = "2.4.3"
log = "0.4.29"
# `bundled` ships SQLite with the binary so we don't depend on the system
# library version. `janis.db` holds the track library and user preferences.
rusqlite = { version = "0.31", features = ["bundled"] }
# Tag + audio-properties reading for every format Janis plays (MP3, FLAC,
# WAV, AAC/ALAC in MP4, OGG/Opus, AIFF, WavPack). Also serves embedded cover
# art for the Now Playing screen.
lofty = "0.22"
# Recursive folder walk for the library scanner.
walkdir = "2"
# Embedded cover art crosses IPC as a base64 payload.
base64 = "0.22"

# ── Audio engine ────────────────────────────────────────────────────────────
# Cross-platform device I/O: CoreAudio, WASAPI, ALSA. Owns the realtime
# callback — the only thread allowed to touch the output buffer.
cpal = "0.18"
# Decoding + demuxing. Non-default features are opt-in, so every container and
# codec the library scanner accepts is enabled explicitly here; `opt-simd`
# turns on the SSE/AVX/NEON kernels.
symphonia = { version = "0.6", features = [
    "aac",
    "adpcm",
    "aiff",
    "alac",
    "all-meta",
    "flac",
    "isomp4",
    "mp3",
    "ogg",
    "opt-simd",
    "pcm",
    "vorbis",
    "wav",
] }
# Sample-rate conversion, bypassed entirely when the file already matches the
# device rate (the common case, and the only way to stay bit-transparent).
rubato = "5"
# The ten peaking filters of the EQ, one bank per channel.
biquad = "0.6"
# Real-input FFT for the spectrum bands — half the work of a complex FFT.
realfft = "3.5"
# Lock-free SPSC ring: decoder thread produces, realtime callback consumes.
# Realtime-safe by construction (no allocation, no mutex in the callback).
rtrb = "0.4"
# Control-plane channel: IPC commands -> engine thread.
crossbeam-channel = "0.5"
# Opus. Symphonia 0.6 has no Opus decoder, so `audio/opus.rs` wraps libopus as
# one. `opusic-sys` builds libopus from bundled source with cmake — see
# flake.nix. `symphonia-common` is not re-exported by the `symphonia` facade
# but carries the OpusHead parser, and is pinned to the same version so the
# two cannot drift apart.
# EBU R128 loudness, for files whose tags carry no ReplayGain. Pure Rust, so
# it adds nothing to the build the way libopus does.
ebur128 = "0.1"
opus = "0.4"
symphonia-common = "0.6.1"
# Web radio. Buffers an HTTP stream into something `Read + Seek`, which is
# what Symphonia needs — so a station goes through exactly the same decode,
# EQ and analyser path as a local file. `default-features = false` keeps
# reqwest off native-tls (and so off OpenSSL on Linux).
stream-download = { version = "0.24", default-features = false, features = [
    "reqwest",
    "reqwest-rustls",
    "temp-storage",
] }
# Icecast/Shoutcast in-band track titles, stripped out of the audio stream.
icy-metadata = { version = "0.6", features = ["reqwest"] }

[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

# Audio DSP is unusably slow under the default dev profile (opt-level 0 in
# every dependency means the decoder cannot keep the ring fed). Optimise
# dependencies while keeping our own crate debuggable.
[profile.dev.package."*"]
opt-level = 2
